<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tetris</title>

    <!-- Tela cheia quando aberto pelo ícone na tela de início -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tetris">
    <meta name="theme-color" content="#1C1838">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --night: #1C1838;
            --well: #110E24;
            --surface: #29234F;
            --surface-pressed: #3A3170;
            --line: rgba(255, 255, 255, 0.08);
            --text: #F3F0FF;
            --muted: #A49DC9;
            --amber: #FFB547;
            --amber-pressed: #E8961F;
            --on-amber: #2A1A00;
            --btn: clamp(54px, 15.5vw, 68px);
        }

        * {
            box-sizing: border-box;
        }

        html {
            height: 100%;
            background: var(--night);
            overscroll-behavior: none;
        }

        body {
            /* Ocupa a tela inteira, sem rolar, e respeita o notch e a barra inferior do iPhone */
            position: fixed;
            inset: 0;
            margin: 0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: var(--night);
            color: var(--text);
            font-family: 'Lexend', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
            color: inherit;
            border: 0;
            padding: 0;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid var(--amber);
            outline-offset: 3px;
        }

        .app {
            height: 100%;
            max-width: 460px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px 16px 16px;
        }

        /* ---------- Placar ---------- */

        .hud {
            flex: none;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat {
            height: 52px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            line-height: 1;
            min-width: 0;
        }

        .stat-score {
            flex: 1;
        }

        .stat-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        .stat-value {
            display: inline-block;
            transform-origin: left center;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .stat-score .stat-value {
            font-size: clamp(24px, 7.5vw, 32px);
        }

        .stat-best {
            align-items: flex-end;
            text-align: right;
        }

        .stat-best .stat-value {
            font-size: 18px;
            font-weight: 700;
        }

        .next {
            flex: none;
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: var(--well);
            box-shadow: inset 0 0 0 1px var(--line);
        }

        #next-canvas {
            display: block;
            width: 44px;
            height: 44px;
        }

        .icon-btn {
            flex: none;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--surface);
            transition: opacity 0.2s;
        }

        .icon-btn:disabled {
            opacity: 0.35;
            cursor: default;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ---------- Tabuleiro ---------- */

        .board {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .well {
            --cell: 20px;
            position: relative;
            border-radius: 16px;
            box-shadow: 0 0 0 1px var(--line), 0 24px 48px -24px rgba(0, 0, 0, 0.7);
        }

        #tetris {
            display: block;
            border-radius: 16px;
        }

        .well.cleared {
            animation: clear-glow 0.5s ease-out;
        }

        @keyframes clear-glow {
            30% {
                box-shadow: 0 0 0 3px rgba(255, 181, 71, 0.85), 0 0 40px 6px rgba(255, 181, 71, 0.35);
            }
        }

        .stat-value.bump {
            animation: bump 0.35s ease-out;
        }

        @keyframes bump {
            40% {
                transform: scale(1.14);
                color: var(--amber);
            }
        }

        /* ---------- Telas de início, pausa e fim ---------- */

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--cell) * 0.9);
            padding: calc(var(--cell) * 0.8);
            text-align: center;
            border-radius: 16px;
            background: rgba(17, 14, 36, 0.74);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
        }

        .overlay[hidden],
        .overlay [hidden] {
            display: none;
        }

        .wordmark {
            display: flex;
            gap: calc(var(--cell) * 0.22);
        }

        .wordmark span {
            --tile: calc(var(--cell) * 1.55);
            width: var(--tile);
            height: var(--tile);
            display: grid;
            place-items: center;
            border-radius: calc(var(--tile) * 0.24);
            background: var(--c);
            color: var(--night);
            font-size: calc(var(--tile) * 0.56);
            font-weight: 800;
            box-shadow: inset 0 3px 0 rgba(255, 255, 255, 0.4), inset 0 -4px 0 rgba(0, 0, 0, 0.18);
            animation: tile-drop 0.7s cubic-bezier(0.34, 1.45, 0.55, 1) both;
            animation-delay: calc(var(--i) * 80ms + 150ms);
        }

        @keyframes tile-drop {
            from {
                transform: translateY(-180%);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            to {
                transform: none;
                opacity: 1;
            }
        }

        .overlay h2 {
            margin: 0;
            font-size: min(calc(var(--cell) * 1.25), 32px);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            text-wrap: balance;
        }

        .overlay p {
            margin: 0;
            max-width: 15em;
            font-size: clamp(14px, calc(var(--cell) * 0.66), 16px);
            line-height: 1.45;
            color: var(--muted);
        }

        .play-btn {
            padding: 0.8em 1.9em;
            border-radius: 999px;
            background: var(--amber);
            color: var(--on-amber);
            font-size: clamp(15px, calc(var(--cell) * 0.75), 18px);
            font-weight: 700;
            box-shadow: 0 5px 0 var(--amber-pressed);
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 var(--amber-pressed);
        }

        /* ---------- Controles de toque ---------- */

        .controls {
            flex: none;
            display: none;
            align-items: center;
            gap: 12px;
            touch-action: none;
        }

        .dpad {
            flex: 1;
            display: flex;
            height: var(--btn);
            border-radius: 999px;
            overflow: hidden;
            background: var(--surface);
        }

        .dpad .touch-btn {
            flex: 1;
        }

        .dpad .touch-btn + .touch-btn {
            box-shadow: inset 1px 0 0 var(--line);
        }

        .round-btn {
            flex: none;
            width: var(--btn);
            height: var(--btn);
            border-radius: 50%;
            background: var(--surface);
        }

        .round-btn.drop {
            background: var(--amber);
            color: var(--on-amber);
        }

        .touch-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            touch-action: none;
            transition: transform 0.06s, background 0.06s;
        }

        .round-btn.touch-btn {
            background: var(--surface);
        }

        .round-btn.drop.touch-btn {
            background: var(--amber);
        }

        .touch-btn svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .dpad .touch-btn.pressed {
            background: var(--surface-pressed);
        }

        .round-btn.touch-btn.pressed {
            background: var(--surface-pressed);
            transform: scale(0.92);
        }

        .round-btn.drop.touch-btn.pressed {
            background: var(--amber-pressed);
        }

        /* ---------- Dica de teclado (computador) ---------- */

        .keys-hint {
            flex: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 12px;
            margin: 0;
            font-size: 12px;
            color: var(--muted);
        }

        .keys-hint span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        kbd {
            min-width: 24px;
            padding: 3px 7px;
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 12px;
            text-align: center;
        }

        /* Em celulares e tablets: mostra os botões e esconde a dica de teclado */
        @media (pointer: coarse) {
            .controls {
                display: flex;
            }
            .keys-hint {
                display: none;
            }
        }

        @media (max-width: 360px) {
            .app {
                gap: 10px;
                padding: 10px 12px 12px;
            }
            .hud {
                gap: 10px;
            }
            .next {
                width: 50px;
                height: 50px;
            }
            #next-canvas {
                width: 38px;
                height: 38px;
            }
            .icon-btn {
                width: 40px;
                height: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .wordmark span,
            .well.cleared,
            .stat-value.bump {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="hud">
            <div class="stat stat-score">
                <span class="stat-label">Pontos</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat stat-best">
                <span class="stat-label">Recorde</span>
                <span class="stat-value" id="high-score">0</span>
            </div>
            <div class="next" title="Próxima peça" aria-label="Próxima peça">
                <canvas id="next-canvas"></canvas>
            </div>
            <button class="icon-btn" id="pause-btn" aria-label="Pausar" disabled>
                <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
            </button>
        </header>

        <main class="board" id="board">
            <div class="well" id="well">
                <canvas id="tetris"></canvas>

                <div class="overlay" id="overlay">
                    <div class="wordmark" id="wordmark" aria-label="Tetris">
                        <span style="--c:#B98CFF; --i:0" aria-hidden="true">T</span>
                        <span style="--c:#52D1F5; --i:1" aria-hidden="true">E</span>
                        <span style="--c:#FFD54F; --i:2" aria-hidden="true">T</span>
                        <span style="--c:#FF6F91; --i:3" aria-hidden="true">R</span>
                        <span style="--c:#5FE3A1; --i:4" aria-hidden="true">I</span>
                        <span style="--c:#FFA45B; --i:5" aria-hidden="true">S</span>
                    </div>
                    <h2 id="overlay-title" hidden></h2>
                    <p id="overlay-text"></p>
                    <button class="play-btn" id="start-btn">Jogar</button>
                </div>
            </div>
        </main>

        <nav class="controls" aria-label="Controles">
            <div class="dpad">
                <button class="touch-btn" data-action="left" aria-label="Mover para a esquerda">
                    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <button class="touch-btn" data-action="down" aria-label="Descer">
                    <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>
                </button>
                <button class="touch-btn" data-action="right" aria-label="Mover para a direita">
                    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
            <button class="touch-btn round-btn" data-action="rotate" aria-label="Girar">
                <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.35-5.65"/><path d="M20 4v5h-5"/></svg>
            </button>
            <button class="touch-btn round-btn drop" data-action="drop" aria-label="Derrubar">
                <svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M6.5 10l5.5 5.5 5.5-5.5"/><path d="M5 20h14"/></svg>
            </button>
        </nav>

        <p class="keys-hint">
            <span><kbd>←</kbd><kbd>→</kbd> mover</span>
            <span><kbd>↓</kbd> descer</span>
            <span><kbd>↑</kbd> girar</span>
            <span><kbd>Espaço</kbd> derrubar</span>
            <span><kbd>P</kbd> pausar</span>
        </p>
    </div>

<script>
    const COLS = 12;
    const ROWS = 24;
    const WELL_COLOR = '#110E24';

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextContext = nextCanvas.getContext('2d');

    const boardElement = document.getElementById('board');
    const wellElement = document.getElementById('well');
    const scoreElement = document.getElementById('score');
    const highScoreElement = document.getElementById('high-score');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayText = document.getElementById('overlay-text');
    const wordmark = document.getElementById('wordmark');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');

    // Cores das peças, em tons de pedras preciosas
    const colors = [
        null,
        '#B98CFF', // T - Ametista
        '#52D1F5', // I - Água-marinha
        '#5FE3A1', // S - Esmeralda
        '#FF6F91', // Z - Rubi
        '#FFA45B', // L - Topázio
        '#FFD54F', // O - Citrino
        '#6C8EFF'  // J - Safira
    ];

    // Mistura a cor com branco (valor positivo) ou preto (valor negativo)
    function shade(hex, amount) {
        const n = parseInt(hex.slice(1), 16);
        const target = amount < 0 ? 0 : 255;
        const p = Math.abs(amount);
        const mix = c => Math.round(c + (target - c) * p);
        return `rgb(${mix(n >> 16)}, ${mix((n >> 8) & 255)}, ${mix(n & 255)})`;
    }

    const palette = colors.map(c => c && { top: shade(c, 0.22), bottom: shade(c, -0.12) });

    const formatNumber = n => n.toLocaleString('pt-BR');

    // Formato das peças (Tetrominós)
    function createPiece(type) {
        if (type === 'I') {
            return [
                [0, 2, 0, 0],
                [0, 2, 0, 0],
                [0, 2, 0, 0],
                [0, 2, 0, 0],
            ];
        } else if (type === 'L') {
            return [
                [0, 5, 0],
                [0, 5, 0],
                [0, 5, 5],
            ];
        } else if (type === 'J') {
            return [
                [0, 7, 0],
                [0, 7, 0],
                [7, 7, 0],
            ];
        } else if (type === 'O') {
            return [
                [6, 6],
                [6, 6],
            ];
        } else if (type === 'Z') {
            return [
                [4, 4, 0],
                [0, 4, 4],
                [0, 0, 0],
            ];
        } else if (type === 'S') {
            return [
                [0, 3, 3],
                [3, 3, 0],
                [0, 0, 0],
            ];
        } else if (type === 'T') {
            return [
                [0, 1, 0],
                [1, 1, 1],
                [0, 0, 0],
            ];
        }
    }

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) {
            matrix.push(new Array(w).fill(0));
        }
        return matrix;
    }

    const arena = createMatrix(COLS, ROWS);

    // Recorde salvo no navegador (ignora se o armazenamento não estiver disponível)
    function loadHighScore() {
        try {
            return parseInt(localStorage.getItem('tetris_highscore')) || 0;
        } catch (e) {
            return 0;
        }
    }

    function saveHighScore(value) {
        try {
            localStorage.setItem('tetris_highscore', value);
        } catch (e) {}
    }

    const player = {
        pos: {x: 0, y: 0},
        matrix: null,
        score: 0,
        highScore: loadHighScore()
    };

    const nextPlayer = {
        matrix: null,
    };

    let recordAtStart = player.highScore;
    let dropCounter = 0;
    let dropInterval = 1000; // Velocidade de descida (ms)
    let lastTime = 0;
    let gameStarted = false;
    let paused = false;
    let frameId = null;

    const isPlaying = () => gameStarted && !paused;

    // ---------- Regras do jogo ----------

    function arenaSweep() {
        let rowCount = 1;
        let cleared = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) {
                    continue outer;
                }
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;

            player.score += rowCount * 100;
            rowCount *= 2;
            cleared++;
        }
        updateScore();
        if (cleared > 0) {
            restartAnimation(wellElement, 'cleared');
            restartAnimation(scoreElement, 'bump');
        }
    }

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 &&
                   (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [
                    matrix[x][y],
                    matrix[y][x],
                ] = [
                    matrix[y][x],
                    matrix[x][y],
                ];
            }
        }
        if (dir > 0) {
            matrix.forEach(row => row.reverse());
        } else {
            matrix.reverse();
        }
    }

    // Fixa a peça, limpa as linhas completas e traz a próxima
    function lockPiece() {
        merge(arena, player);
        arenaSweep();
        playerReset();
        dropCounter = 0;
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            lockPiece();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        lockPiece();
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerReset() {
        if (nextPlayer.matrix === null) {
            nextPlayer.matrix = createPiece(getRandomPieceType());
        }
        player.matrix = nextPlayer.matrix;
        nextPlayer.matrix = createPiece(getRandomPieceType());

        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

        if (collide(arena, player)) {
            gameOver();
        }
    }

    function getRandomPieceType() {
        const pieces = 'TJLOSZI';
        return pieces[pieces.length * Math.random() | 0];
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    // Linha onde a peça atual vai cair (para desenhar a sombra)
    function ghostY() {
        const startY = player.pos.y;
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        const landing = player.pos.y - 1;
        player.pos.y = startY;
        return landing;
    }

    function updateScore() {
        scoreElement.textContent = formatNumber(player.score);
        if (player.score > player.highScore) {
            player.highScore = player.score;
            saveHighScore(player.highScore);
        }
        highScoreElement.textContent = formatNumber(player.highScore);
    }

    // ---------- Andamento da partida ----------

    function update(time) {
        if (!isPlaying()) {
            frameId = null;
            return;
        }

        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;

        if (dropCounter > dropInterval) {
            playerDrop();
        }

        draw();
        frameId = requestAnimationFrame(update);
    }

    function startLoop() {
        lastTime = performance.now();
        if (frameId === null) {
            frameId = requestAnimationFrame(update);
        }
    }

    function startGame() {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        recordAtStart = player.highScore;
        nextPlayer.matrix = null;
        updateScore();

        gameStarted = true;
        paused = false;
        playerReset();
        dropCounter = 0;
        hideOverlay();
        startLoop();
    }

    function gameOver() {
        gameStarted = false;
        updateScore();
        draw();
        showOverlay('over', player.score > recordAtStart);
    }

    function pauseGame() {
        if (!isPlaying()) return;
        paused = true;
        showOverlay('pause');
    }

    function resumeGame() {
        if (!paused) return;
        paused = false;
        hideOverlay();
        startLoop();
    }

    // Pausa sozinho quando o app vai para segundo plano (ligação, notificação etc.)
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) pauseGame();
    });

    function showOverlay(mode, isRecord) {
        overlay.dataset.mode = mode;
        wordmark.hidden = mode !== 'start';
        overlayTitle.hidden = mode === 'start';

        if (mode === 'start') {
            overlayText.textContent = 'Encaixe as peças para completar linhas.';
            startBtn.textContent = 'Jogar';
        } else if (mode === 'pause') {
            overlayTitle.textContent = 'Pausado';
            overlayText.textContent = `Você tem ${formatNumber(player.score)} pontos.`;
            startBtn.textContent = 'Continuar';
        } else {
            overlayTitle.textContent = isRecord ? 'Novo recorde!' : 'Fim de jogo';
            overlayText.textContent = `Você fez ${formatNumber(player.score)} pontos.`;
            startBtn.textContent = 'Jogar de novo';
        }

        overlay.hidden = false;
        pauseBtn.disabled = mode !== 'pause';
    }

    function hideOverlay() {
        overlay.hidden = true;
        pauseBtn.disabled = false;
    }

    function overlayAction() {
        if (overlay.dataset.mode === 'pause') {
            resumeGame();
        } else {
            startGame();
        }
    }

    function restartAnimation(element, className) {
        element.classList.remove(className);
        void element.offsetWidth;
        element.classList.add(className);
    }

    // ---------- Desenho ----------

    let cellSize = 20;

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) {
            ctx.roundRect(x, y, w, h, r);
        } else {
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }
    }

    function drawCell(ctx, x, y, value) {
        const gradient = ctx.createLinearGradient(0, y, 0, y + 1);
        gradient.addColorStop(0, palette[value].top);
        gradient.addColorStop(1, palette[value].bottom);
        ctx.fillStyle = gradient;
        roundRect(ctx, x + 0.05, y + 0.05, 0.9, 0.9, 0.2);
        ctx.fill();

        // Brilho no topo do bloco
        ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
        roundRect(ctx, x + 0.2, y + 0.14, 0.6, 0.11, 0.055);
        ctx.fill();
    }

    function drawGhostCell(ctx, x, y, value) {
        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = colors[value];
        ctx.lineWidth = 0.07;
        roundRect(ctx, x + 0.12, y + 0.12, 0.76, 0.76, 0.16);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    function drawMatrix(matrix, offset, ctx, ghost) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    (ghost ? drawGhostCell : drawCell)(ctx, x + offset.x, y + offset.y, value);
                }
            });
        });
    }

    function draw() {
        context.fillStyle = WELL_COLOR;
        context.fillRect(0, 0, COLS, ROWS);

        // Pontinhos de grade para ajudar a mirar
        context.fillStyle = 'rgba(255, 255, 255, 0.08)';
        for (let y = 1; y < ROWS; y++) {
            for (let x = 1; x < COLS; x++) {
                context.fillRect(x - 0.035, y - 0.035, 0.07, 0.07);
            }
        }

        drawMatrix(arena, {x: 0, y: 0}, context);

        if (gameStarted && player.matrix) {
            drawMatrix(player.matrix, {x: player.pos.x, y: ghostY()}, context, true);
            drawMatrix(player.matrix, player.pos, context);
        }

        drawNext();
    }

    function drawNext() {
        nextContext.clearRect(0, 0, 4, 4);
        const m = nextPlayer.matrix;
        if (!m) return;

        // Centraliza a peça pelo espaço que ela realmente ocupa
        let minX = 4, maxX = -1, minY = 4, maxY = -1;
        m.forEach((row, y) => row.forEach((value, x) => {
            if (value !== 0) {
                minX = Math.min(minX, x);
                maxX = Math.max(maxX, x);
                minY = Math.min(minY, y);
                maxY = Math.max(maxY, y);
            }
        }));
        const offsetX = (4 - (maxX - minX + 1)) / 2 - minX;
        const offsetY = (4 - (maxY - minY + 1)) / 2 - minY;
        drawMatrix(m, {x: offsetX, y: offsetY}, nextContext);
    }

    // Ajusta o tabuleiro ao espaço disponível, com blocos de tamanho inteiro e nítidos
    function fitBoard() {
        const box = boardElement.getBoundingClientRect();
        if (box.width === 0 || box.height === 0) return;

        const pixelRatio = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);
        cellSize = Math.max(10, Math.floor(Math.min(box.width / COLS, box.height / ROWS)));

        const width = cellSize * COLS;
        const height = cellSize * ROWS;
        wellElement.style.width = width + 'px';
        wellElement.style.height = height + 'px';
        wellElement.style.setProperty('--cell', cellSize + 'px');
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        context.setTransform(cellSize * pixelRatio, 0, 0, cellSize * pixelRatio, 0, 0);

        const nextSize = nextCanvas.getBoundingClientRect().width || 44;
        nextCanvas.width = Math.round(nextSize * pixelRatio);
        nextCanvas.height = Math.round(nextSize * pixelRatio);
        const nextCell = (nextSize / 4) * pixelRatio;
        nextContext.setTransform(nextCell, 0, 0, nextCell, 0, 0);

        draw();
    }

    if ('ResizeObserver' in window) {
        new ResizeObserver(fitBoard).observe(boardElement);
    }
    window.addEventListener('resize', fitBoard);

    // ---------- Controles do Teclado ----------

    document.addEventListener('keydown', event => {
        if (event.key === 'p' || event.key === 'P' || event.key === 'Escape') {
            if (paused) {
                resumeGame();
            } else {
                pauseGame();
            }
            event.preventDefault();
            return;
        }

        if (!isPlaying()) {
            if ((event.key === 'Enter' || event.key === ' ') && document.activeElement !== startBtn) {
                event.preventDefault();
                overlayAction();
            }
            return;
        }

        if (event.key === 'ArrowLeft') {
            playerMove(-1);
        } else if (event.key === 'ArrowRight') {
            playerMove(1);
        } else if (event.key === 'ArrowDown') {
            playerDrop();
        } else if (event.key === 'ArrowUp' || event.key === 'x' || event.key === 'X') {
            playerRotate(1);
        } else if (event.key === ' ') {
            playerHardDrop();
        } else {
            return;
        }
        event.preventDefault();
    });

    // ---------- Controles de Toque ----------

    const touchActions = {
        left: () => playerMove(-1),
        right: () => playerMove(1),
        down: () => playerDrop(),
        rotate: () => playerRotate(1),
        drop: () => playerHardDrop(),
    };

    // Segurar o botão repete o movimento (esquerda, direita e descer)
    const repeatSpeed = { left: 70, right: 70, down: 45 };

    document.querySelectorAll('.touch-btn').forEach(btn => {
        const action = btn.dataset.action;
        let delayTimer = null;
        let repeatTimer = null;

        const stop = () => {
            clearTimeout(delayTimer);
            clearInterval(repeatTimer);
            delayTimer = null;
            repeatTimer = null;
            btn.classList.remove('pressed');
        };

        btn.addEventListener('pointerdown', event => {
            event.preventDefault();
            if (!isPlaying()) return;
            stop();
            btn.classList.add('pressed');
            touchActions[action]();

            if (repeatSpeed[action]) {
                delayTimer = setTimeout(() => {
                    repeatTimer = setInterval(() => {
                        if (isPlaying()) {
                            touchActions[action]();
                        } else {
                            stop();
                        }
                    }, repeatSpeed[action]);
                }, 180);
            }
        });

        ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
            btn.addEventListener(type, stop);
        });
        btn.addEventListener('contextmenu', event => event.preventDefault());
    });

    startBtn.addEventListener('click', overlayAction);

    pauseBtn.addEventListener('click', () => {
        if (paused) {
            resumeGame();
        } else {
            pauseGame();
        }
    });

    // ---------- Início ----------

    updateScore();
    showOverlay('start');
    fitBoard();
</script>
</body>
</html>
